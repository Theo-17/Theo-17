name: Generar Animacion Pacman

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Generar juego de Pacman con las contribuciones
        uses: platane/snk/svg-only@v3
        with:
          github_user_name: Theo-17
          outputs: |
            dist/pacman-contribution-graph.svg
            dist/pacman-contribution-graph-dark.svg?palette=github-dark
        env:
          # Cambiamos el token aquí para que pueda leer tus 848 aportes privados
          GITHUB_TOKEN: ${{ secrets.PACMAN_TOKEN }}
            
      - name: Subir los gráficos a la rama de salida
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: pacman-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
