name: Generar Animacion Pacman

on:
  schedule: # Se ejecuta automáticamente cada 24 horas
    - cron: "0 0 * * *"
  workflow_dispatch: # Te permite ejecutarlo manualmente cuando quieras

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Generar juego de Pacman con las contribuciones
        uses: platane/snk/svg-only@v3
        with:
          github_user_name: Theo-17
          outputs: |
            dist/pacman-contribution-graph.svg
            dist/pacman-contribution-graph-dark.svg?palette=github-dark
            
      - name: Subir los gráficos a la rama de salida
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: pacman-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
